<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="_csrf"
        th:content="${_csrf.token}"
    >
    <meta
        name="_csrf_header"
        th:content="${_csrf.headerName}"
    >

    <title>Schedular - 로그인</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                Inter,
                Pretendard,
                Arial,
                sans-serif;

            color: #f0f6fc;
            background: #030712;
        }

        /* ==============================
           전체 네트워크 Canvas
        ============================== */

        #spaceCanvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 0;
            pointer-events: none;
        }

        /* ==============================
           배경 블러
        ============================== */

        .blur {
            position: fixed;

            border-radius: 50%;
            filter: blur(130px);

            pointer-events: none;
            z-index: 1;

            transition: opacity 1s ease;
        }

        .blur-blue {
            width: 520px;
            height: 520px;

            top: -180px;
            left: -180px;

            background: #2563eb;
            opacity: 0.19;
        }

        .blur-purple {
            width: 500px;
            height: 500px;

            right: -180px;
            bottom: -180px;

            background: #7c3aed;
            opacity: 0.22;
        }

        .blur-center {
            width: 420px;
            height: 420px;

            top: 35%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: #253bd8;
            opacity: 0.07;
        }

        body.login-complete .blur {
            opacity: 0;
        }

        /* ==============================
           로그인 카드
        ============================== */

        .login-container {
            position: relative;
            z-index: 10;

            width:
                min(
                    470px,
                    calc(100vw - 40px)
                );

            padding:
                48px
                42px
                42px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(19, 26, 52, 0.82),
                    rgba(7, 11, 29, 0.90)
                );

            border:
                1px solid
                rgba(148, 163, 184, 0.20);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 35px 100px
                rgba(0, 0, 0, 0.55),

                inset 0 1px 0
                rgba(255, 255, 255, 0.04);
        }

        .login-container::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: inherit;
            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(68, 139, 255, 0.05),
                    transparent 40%,
                    rgba(157, 78, 221, 0.05)
                );
        }

        /* ==============================
           로고
        ============================== */

        .logo {
            position: relative;

            text-align: center;
            margin-bottom: 10px;

            font-size: 46px;
            font-weight: 800;

            letter-spacing: -1.5px;

            background:
                linear-gradient(
                    90deg,
                    #2790ff,
                    #6674ff,
                    #995cff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(70, 110, 255, 0.22)
                );
        }

        .subtitle {
            text-align: center;
            margin-bottom: 34px;

            color: #aab3ca;
            font-size: 14px;
        }

        /* ==============================
           탭
        ============================== */

        .tabs {
            display: flex;

            padding: 4px;
            margin-bottom: 32px;

            border-radius: 13px;

            border:
                1px solid
                rgba(102, 117, 171, 0.25);

            background:
                rgba(3, 7, 24, 0.62);
        }

        .tab {
            flex: 1;

            padding: 12px;

            border: 0;
            border-radius: 10px;

            background: transparent;

            color: #adb6cc;

            cursor: pointer;
            font-size: 15px;

            transition:
                background 0.25s,
                color 0.25s,
                box-shadow 0.25s;
        }

        .tab.active {
            color: #58a6ff;

            background:
                linear-gradient(
                    90deg,
                    rgba(35, 93, 200, 0.14),
                    rgba(92, 77, 230, 0.13)
                );

            box-shadow:
                inset 0 0 0 1px
                rgba(78, 111, 255, 0.32),

                0 0 20px
                rgba(59, 82, 255, 0.08);
        }

        .tab:not(.active):hover {
            color: white;

            background:
                rgba(255, 255, 255, 0.03);
        }

        /* ==============================
           입력 영역
        ============================== */

        .field {
            position: relative;
            margin-bottom: 27px;
        }

        .field label {
            display: block;

            margin-bottom: 9px;

            color: #eef2ff;

            font-size: 14px;
            font-weight: 600;
        }

        .input-space {
            position: relative;
            isolation: isolate;
        }

        .input-space::before {
            content: "";

            position: absolute;
            inset: -20px;

            z-index: -2;

            border-radius: 30px;
            opacity: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 38%,
                    rgba(52, 117, 255, 0.10) 55%,
                    rgba(125, 73, 255, 0.12) 67%,
                    transparent 78%
                );

            filter: blur(10px);

            transition:
                opacity 0.35s;
        }

        .input-space:focus-within::before {
            opacity: 1;
        }

        /* ==============================
           입력창
        ============================== */

        .input-space input {
            position: relative;
            z-index: 5;

            width: 100%;
            height: 58px;

            padding:
                0
                52px
                0
                50px;

            border-radius: 13px;

            border:
                1px solid
                rgba(98, 115, 170, 0.42);

            outline: none;

            color: white;
            font-size: 15px;

            caret-color: #65b1ff;

            background:
                linear-gradient(
                    90deg,
                    rgba(9, 17, 44, 0.96),
                    rgba(9, 13, 34, 0.96)
                );

            transition:
                border-color 0.25s,
                box-shadow 0.25s,
                transform 0.25s;
        }

        .input-space input::placeholder {
            color: #596886;
        }

        .field.username .input-space input:focus {
            border-color: #3ca3ff;

            transform:
                translateY(-1px);

            box-shadow:
                0 0 0 1px
                rgba(65, 165, 255, 0.30),

                0 0 14px
                rgba(30, 144, 255, 0.50),

                0 0 35px
                rgba(76, 82, 255, 0.20);
        }

        .field.password .input-space input:focus {
            border-color: #b45dff;

            transform:
                translateY(-1px);

            box-shadow:
                0 0 0 1px
                rgba(180, 93, 255, 0.32),

                0 0 14px
                rgba(180, 67, 255, 0.45),

                0 0 38px
                rgba(76, 73, 255, 0.22);
        }

        /* ==============================
           입력창 아이콘
        ============================== */

        .input-icon {
            position: absolute;
            z-index: 7;

            top: 50%;
            left: 17px;

            transform:
                translateY(-50%);

            width: 21px;
            height: 21px;

            color: #6175a6;

            pointer-events: none;

            transition:
                color 0.25s,
                filter 0.25s;
        }

        .input-space:focus-within
        .input-icon {
            color: #64aaff;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(80, 160, 255, 0.45)
                );
        }

        .password
        .input-space:focus-within
        .input-icon {
            color: #bd72ff;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(184, 89, 255, 0.48)
                );
        }

        /* ==============================
           비밀번호 보기
        ============================== */

        .password-toggle {
            position: absolute;
            z-index: 8;

            top: 50%;
            right: 17px;

            transform:
                translateY(-50%);

            width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;

            background: transparent;

            color: #7280a5;

            cursor: pointer;
        }

        .password-toggle:hover {
            color: #c2cbdf;
        }

        .password-toggle svg {
            width: 21px;
            height: 21px;
        }

        /* ==============================
           입력창 별가루 Canvas
        ============================== */

        .dust-canvas {
            position: absolute;
            z-index: 2;

            pointer-events: none;

            width:
                calc(
                    100% + 190px
                );

            height: 170px;

            left: -95px;
            top: 50%;

            transform:
                translateY(-50%);
        }

        /* ==============================
           로그인 버튼
        ============================== */

        .login-button {
            position: relative;

            width: 100%;

            margin-top: 4px;
            padding: 15px;

            overflow: hidden;

            border: 0;
            border-radius: 12px;

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #1677f2,
                    #514cf2,
                    #8b2fe7
                );

            box-shadow:
                0 10px 30px
                rgba(76, 72, 235, 0.26),

                inset 0 1px 0
                rgba(255, 255, 255, 0.20);

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                opacity 0.25s;
        }

        .login-button::before {
            content: "";

            position: absolute;

            top: -100%;
            left: -30%;

            width: 35%;
            height: 300%;

            transform:
                rotate(25deg);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.24),
                    transparent
                );

            transition:
                left 0.6s;
        }

        .login-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 15px 38px
                rgba(80, 73, 240, 0.40),

                0 0 25px
                rgba(121, 58, 255, 0.17);
        }

        .login-button:hover::before {
            left: 115%;
        }

        .login-button.loading {
            pointer-events: none;
            opacity: 0.75;
        }

        .login-button.loading::after {
            content: "";

            display: inline-block;

            width: 13px;
            height: 13px;

            margin-left: 10px;

            vertical-align: -2px;

            border-radius: 50%;

            border:
                2px solid
                rgba(255, 255, 255, 0.35);

            border-top-color: white;

            animation:
                spinner
                0.7s
                linear
                infinite;
        }

        @keyframes spinner {
            to {
                transform:
                    rotate(360deg);
            }
        }

        /* ==============================
           로그인 실패
        ============================== */

        .login-error {
            min-height: 18px;

            margin:
                -8px
                0
                13px;

            text-align: center;

            color: #ff7285;
            font-size: 13px;

            opacity: 0;

            transform:
                translateY(-4px);

            transition:
                opacity 0.2s,
                transform 0.2s;
        }

        .login-error.show {
            opacity: 1;

            transform:
                translateY(0);
        }

        .login-container.login-failed {
            animation:
                loginShake
                0.4s
                ease;
        }

        @keyframes loginShake {
            0%,
            100% {
                transform:
                    translateX(0);
            }

            20% {
                transform:
                    translateX(-8px);
            }

            40% {
                transform:
                    translateX(7px);
            }

            60% {
                transform:
                    translateX(-5px);
            }

            80% {
                transform:
                    translateX(3px);
            }
        }

        /* ==============================
           하단 회원가입
        ============================== */

        .bottom-text {
            margin-top: 26px;

            text-align: center;

            color: #9ea8bd;
            font-size: 14px;
        }

        .bottom-text a {
            margin-left: 3px;

            color: #4b90ff;

            text-decoration: none;
        }

        .bottom-text a:hover {
            color: #77acff;

            text-shadow:
                0 0 10px
                rgba(73, 139, 255, 0.50);
        }

        /* ==============================
           로그인 성공 중앙 빛
        ============================== */

        .success-flash {
            position: fixed;

            z-index: 9;

            top: 50%;
            left: 50%;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            pointer-events: none;

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(105, 163, 255, 0.60) 25%,
                    rgba(120, 75, 255, 0.28) 45%,
                    transparent 72%
                );
        }

        .success-flash.active {
            animation:
                successFlash
                1.6s
                ease-out
                forwards;
        }

        @keyframes successFlash {
            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0);
            }

            20% {
                opacity: 0.85;
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(55);
            }
        }

        /* ==============================
           카드 내부 중앙 집결
        ============================== */

        .login-container.login-success > * {
            animation:
                contentGather
                1.35s
                ease-in
                forwards;
        }

        @keyframes contentGather {
            0% {
                transform:
                    scale(1);

                opacity: 1;

                filter:
                    blur(0);
            }

            45% {
                transform:
                    scale(0.93);

                opacity: 0.88;

                filter:
                    blur(1px);
            }

            100% {
                transform:
                    scale(0.63);

                opacity: 0;

                filter:
                    blur(9px);
            }
        }

        /* ==============================
           카드 전체 소멸
        ============================== */

        .login-container.login-success {
            pointer-events: none;

            animation:
                gatherAndFade
                1.8s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                )
                forwards;
        }

        @keyframes gatherAndFade {
            0% {
                transform:
                    scale(1);

                opacity: 1;

                filter:
                    brightness(1)
                    blur(0);

                box-shadow:
                    0 35px 100px
                    rgba(0, 0, 0, 0.55);
            }

            20% {
                transform:
                    scale(1.025);

                opacity: 1;

                filter:
                    brightness(1.45)
                    blur(0);

                box-shadow:
                    0 0 35px
                    rgba(59, 130, 246, 0.70),

                    0 0 80px
                    rgba(139, 92, 246, 0.50),

                    0 0 140px
                    rgba(99, 102, 241, 0.25);
            }

            50% {
                transform:
                    scale(0.86);

                opacity: 0.77;

                filter:
                    brightness(1.3)
                    blur(3px);
            }

            75% {
                transform:
                    scale(0.57);

                opacity: 0.25;

                filter:
                    brightness(1.8)
                    blur(11px);

                box-shadow:
                    0 0 60px
                    rgba(75, 132, 255, 0.50),

                    0 0 120px
                    rgba(139, 78, 255, 0.35);
            }

            100% {
                transform:
                    scale(0.16);

                opacity: 0;

                filter:
                    brightness(2.4)
                    blur(22px);

                visibility: hidden;

                box-shadow:
                    0 0 0
                    rgba(0, 0, 0, 0);
            }
        }

        /* ==============================
           모바일
        ============================== */

        @media (max-width: 540px) {
            body {
                overflow-y: auto;
            }

            .login-container {
                margin:
                    20px
                    0;

                padding:
                    38px
                    24px
                    34px;
            }

            .logo {
                font-size: 39px;
            }

            .dust-canvas {
                width:
                    calc(
                        100% + 100px
                    );

                left: -50px;
            }
        }
    </style>
</head>

<body>

    <canvas id="spaceCanvas"></canvas>

    <div class="blur blur-blue"></div>
    <div class="blur blur-purple"></div>
    <div class="blur blur-center"></div>

    <div
        class="success-flash"
        id="successFlash"
    ></div>

    <main class="login-container">

        <div class="logo">
            Schedular
        </div>

        <div class="subtitle">
            다시 만나서 반가워요.
        </div>

        <div class="tabs">

            <button
                type="button"
                class="tab active"
            >
                로그인
            </button>

            <button
                type="button"
                class="tab"
                onclick="location.href='/signup'"
            >
                회원가입
            </button>

        </div>

        <form
            id="loginForm"
            action="/login"
            method="post"
        >

            <div class="field username">

                <label for="username">
                    아이디
                </label>

                <div class="input-space">

                    <canvas
                        class="dust-canvas"
                    ></canvas>

                    <svg
                        class="input-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle
                            cx="12"
                            cy="8"
                            r="4"
                        ></circle>

                        <path
                            d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                        ></path>
                    </svg>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="아이디를 입력하세요"
                        autocomplete="username"
                        required
                    >

                </div>
            </div>

            <div class="field password">

                <label for="password">
                    비밀번호
                </label>

                <div class="input-space">

                    <canvas
                        class="dust-canvas"
                    ></canvas>

                    <svg
                        class="input-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="11"
                            rx="2"
                        ></rect>

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        ></path>
                    </svg>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="password-toggle"
                        id="passwordToggle"
                        type="button"
                        aria-label="비밀번호 표시"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            ></circle>
                        </svg>
                    </button>

                </div>
            </div>

            <div
                id="loginError"
                class="login-error"
            >
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>

            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                로그인
            </button>

        </form>

        <div class="bottom-text">

            계정이 없으신가요?

            <a href="/signup">
                회원가입
            </a>

        </div>

    </main>

<script>

    /* ============================================
       전체 네트워크 Canvas
    ============================================ */

    const spaceCanvas =
        document.getElementById(
            "spaceCanvas"
        );

    const spaceCtx =
        spaceCanvas.getContext(
            "2d"
        );

    let backgroundParticles =
        [];

    let successAnimation =
        false;

    let successProgress =
        0;

    function getParticleCount() {

        const area =
            window.innerWidth
            *
            window.innerHeight;

        return Math.min(
            100,

            Math.max(
                45,

                Math.floor(
                    area / 16000
                )
            )
        );
    }

    class BackgroundParticle {

        constructor() {

            this.x =
                Math.random()
                *
                spaceCanvas.width;

            this.y =
                Math.random()
                *
                spaceCanvas.height;

            this.size =
                Math.random()
                * 1.7
                + 0.6;

            this.speedX =
                (
                    Math.random()
                    - 0.5
                )
                * 0.28;

            this.speedY =
                (
                    Math.random()
                    - 0.5
                )
                * 0.28;

            this.color =
                Math.random()
                > 0.5

                ? "59, 130, 246"
                : "139, 92, 246";

            this.alpha =
                Math.random()
                * 0.45
                + 0.25;

            this.alphaSpeed =
                Math.random()
                * 0.005
                + 0.0015;
        }

        update() {

            if (!successAnimation) {

                this.x +=
                    this.speedX;

                this.y +=
                    this.speedY;

                if (
                    this.x < -20
                ) {
                    this.x =
                        spaceCanvas.width
                        + 20;
                }

                if (
                    this.x
                    >
                    spaceCanvas.width
                    + 20
                ) {
                    this.x =
                        -20;
                }

                if (
                    this.y < -20
                ) {
                    this.y =
                        spaceCanvas.height
                        + 20;
                }

                if (
                    this.y
                    >
                    spaceCanvas.height
                    + 20
                ) {
                    this.y =
                        -20;
                }

                this.alpha +=
                    this.alphaSpeed;

                if (
                    this.alpha > 0.85
                    ||
                    this.alpha < 0.22
                ) {
                    this.alphaSpeed *=
                        -1;
                }

            } else {

                const targetX =
                    spaceCanvas.width
                    / 2;

                const targetY =
                    spaceCanvas.height
                    / 2;

                const dx =
                    targetX
                    - this.x;

                const dy =
                    targetY
                    - this.y;

                const pullStrength =
                    0.025
                    +
                    successProgress
                    * 0.08;

                this.x +=
                    dx
                    * pullStrength;

                this.y +=
                    dy
                    * pullStrength;

                if (
                    successProgress
                    < 0.5
                ) {

                    this.alpha =
                        Math.min(
                            1,
                            this.alpha
                            + 0.02
                        );

                } else {

                    this.alpha -=
                        0.025;

                    this.size *=
                        0.97;

                    if (
                        this.alpha < 0
                    ) {
                        this.alpha = 0;
                    }
                }
            }
        }

        draw() {

            if (
                this.alpha <= 0
            ) {
                return;
            }

            spaceCtx.beginPath();

            spaceCtx.arc(
                this.x,
                this.y,
                this.size,
                0,
                Math.PI * 2
            );

            spaceCtx.fillStyle =
                `rgba(
                    ${this.color},
                    ${this.alpha}
                )`;

            spaceCtx.shadowBlur =
                9;

            spaceCtx.shadowColor =
                `rgba(
                    ${this.color},
                    0.5
                )`;

            spaceCtx.fill();

            spaceCtx.shadowBlur =
                0;
        }
    }

    function createBackgroundParticles() {

        backgroundParticles =
            [];

        const count =
            getParticleCount();

        for (
            let i = 0;
            i < count;
            i++
        ) {

            backgroundParticles.push(
                new BackgroundParticle()
            );
        }
    }

    function connectBackgroundParticles() {

        const maxDistance =
            145;

        const fade =
            successAnimation

            ? Math.max(
                0,
                1
                -
                successProgress
                * 1.3
            )

            : 1;

        for (
            let a = 0;
            a <
            backgroundParticles.length;
            a++
        ) {

            for (
                let b = a + 1;
                b <
                backgroundParticles.length;
                b++
            ) {

                const p1 =
                    backgroundParticles[a];

                const p2 =
                    backgroundParticles[b];

                const dx =
                    p1.x
                    -
                    p2.x;

                const dy =
                    p1.y
                    -
                    p2.y;

                const distanceSquared =
                    dx * dx
                    +
                    dy * dy;

                if (
                    distanceSquared
                    <
                    maxDistance
                    *
                    maxDistance
                ) {

                    const distance =
                        Math.sqrt(
                            distanceSquared
                        );

                    const opacity =
                        (
                            1
                            -
                            distance
                            /
                            maxDistance
                        )
                        *
                        0.16
                        *
                        fade;

                    spaceCtx.beginPath();

                    spaceCtx.moveTo(
                        p1.x,
                        p1.y
                    );

                    spaceCtx.lineTo(
                        p2.x,
                        p2.y
                    );

                    spaceCtx.strokeStyle =
                        `rgba(
                            100,
                            143,
                            255,
                            ${opacity}
                        )`;

                    spaceCtx.lineWidth =
                        0.8;

                    spaceCtx.stroke();
                }
            }
        }
    }

    function animateSpace() {

        spaceCtx.clearRect(
            0,
            0,
            spaceCanvas.width,
            spaceCanvas.height
        );

        if (
            successAnimation
        ) {

            successProgress +=
                0.014;

            if (
                successProgress > 1
            ) {
                successProgress = 1;
            }
        }

        for (
            const particle
            of backgroundParticles
        ) {

            particle.update();
            particle.draw();
        }

        connectBackgroundParticles();

        requestAnimationFrame(
            animateSpace
        );
    }

    function resizeSpaceCanvas() {

        spaceCanvas.width =
            window.innerWidth;

        spaceCanvas.height =
            window.innerHeight;

        if (
            !successAnimation
        ) {

            createBackgroundParticles();
        }
    }

    resizeSpaceCanvas();
    animateSpace();

    window.addEventListener(
        "resize",
        resizeSpaceCanvas
    );

    /* ============================================
       입력창 별가루
    ============================================ */

    const inputSpaces =
        document.querySelectorAll(
            ".input-space"
        );

    inputSpaces.forEach(
        (space, index) => {

            const dustCanvas =
                space.querySelector(
                    ".dust-canvas"
                );

            const dustCtx =
                dustCanvas.getContext(
                    "2d"
                );

            const input =
                space.querySelector(
                    "input"
                );

            let dustParticles =
                [];

            let active =
                false;

            function resizeDustCanvas() {

                const width =
                    dustCanvas.clientWidth;

                const height =
                    dustCanvas.clientHeight;

                const ratio =
                    Math.min(
                        window.devicePixelRatio
                        || 1,
                        2
                    );

                dustCanvas.width =
                    width
                    *
                    ratio;

                dustCanvas.height =
                    height
                    *
                    ratio;

                dustCtx.setTransform(
                    ratio,
                    0,
                    0,
                    ratio,
                    0,
                    0
                );
            }

            function createDustParticle(
                burst = false
            ) {

                const width =
                    dustCanvas.clientWidth;

                let color;

                if (
                    index === 0
                ) {

                    color =
                        Math.random()
                        > 0.33

                        ? "63, 158, 255"
                        : "117, 93, 255";

                } else {

                    color =
                        Math.random()
                        > 0.33

                        ? "184, 84, 255"
                        : "94, 105, 255";
                }

                return {

                    angle:
                        Math.random()
                        *
                        Math.PI
                        *
                        2,

                    radiusX:
                        width
                        *
                        (
                            0.28
                            +
                            Math.random()
                            *
                            0.13
                        ),

                    radiusY:
                        32
                        +
                        Math.random()
                        *
                        18,

                    orbitSpeed:
                        (
                            0.003
                            +
                            Math.random()
                            *
                            0.008
                        )
                        *
                        (
                            Math.random()
                            > 0.5
                            ? 1
                            : -1
                        ),

                    size:
                        Math.random()
                        *
                        1.55
                        +
                        0.35,

                    alpha:
                        burst
                        ? 1
                        :
                        Math.random()
                        *
                        0.65
                        +
                        0.2,

                    alphaSpeed:
                        Math.random()
                        *
                        0.018
                        +
                        0.004,

                    color,

                    burst,

                    burstDistance:
                        0,

                    burstSpeed:
                        Math.random()
                        *
                        1.8
                        +
                        0.8
                };
            }

            function startDust() {

                dustParticles =
                    [];

                for (
                    let i = 0;
                    i < 85;
                    i++
                ) {

                    dustParticles.push(
                        createDustParticle()
                    );
                }

                for (
                    let i = 0;
                    i < 35;
                    i++
                ) {

                    dustParticles.push(
                        createDustParticle(
                            true
                        )
                    );
                }
            }

            function drawDustParticle(
                particle,
                x,
                y
            ) {

                dustCtx.beginPath();

                dustCtx.arc(
                    x,
                    y,
                    particle.size,
                    0,
                    Math.PI * 2
                );

                dustCtx.fillStyle =
                    `rgba(
                        ${particle.color},
                        ${particle.alpha}
                    )`;

                dustCtx.shadowBlur =
                    particle.size
                    *
                    6;

                dustCtx.shadowColor =
                    `rgba(
                        ${particle.color},
                        0.85
                    )`;

                dustCtx.fill();

                dustCtx.shadowBlur =
                    0;

                if (
                    particle.size
                    > 1.25
                    &&
                    particle.alpha
                    > 0.55
                ) {

                    const sparkle =
                        3
                        +
                        particle.size
                        *
                        1.8;

                    dustCtx.beginPath();

                    dustCtx.moveTo(
                        x - sparkle,
                        y
                    );

                    dustCtx.lineTo(
                        x + sparkle,
                        y
                    );

                    dustCtx.moveTo(
                        x,
                        y - sparkle
                    );

                    dustCtx.lineTo(
                        x,
                        y + sparkle
                    );

                    dustCtx.strokeStyle =
                        `rgba(
                            238,
                            243,
                            255,
                            ${
                                particle.alpha
                                *
                                0.7
                            }
                        )`;

                    dustCtx.lineWidth =
                        0.65;

                    dustCtx.stroke();
                }
            }

            function animateDust() {

                const width =
                    dustCanvas.clientWidth;

                const height =
                    dustCanvas.clientHeight;

                dustCtx.clearRect(
                    0,
                    0,
                    width,
                    height
                );

                if (
                    active
                    &&
                    !successAnimation
                ) {

                    const centerX =
                        width / 2;

                    const centerY =
                        height / 2;

                    dustParticles =
                        dustParticles.filter(
                            particle => {

                                particle.angle +=
                                    particle.orbitSpeed;

                                let x;
                                let y;

                                if (
                                    particle.burst
                                ) {

                                    particle
                                        .burstDistance
                                        +=
                                        particle
                                            .burstSpeed;

                                    x =
                                        centerX
                                        +
                                        Math.cos(
                                            particle.angle
                                        )
                                        *
                                        (
                                            particle.radiusX
                                            +
                                            particle
                                                .burstDistance
                                        );

                                    y =
                                        centerY
                                        +
                                        Math.sin(
                                            particle.angle
                                        )
                                        *
                                        (
                                            particle.radiusY
                                            +
                                            particle
                                                .burstDistance
                                            *
                                            0.13
                                        );

                                    particle.alpha -=
                                        0.018;

                                    if (
                                        particle.alpha
                                        <= 0
                                    ) {

                                        return false;
                                    }

                                } else {

                                    x =
                                        centerX
                                        +
                                        Math.cos(
                                            particle.angle
                                        )
                                        *
                                        particle.radiusX;

                                    y =
                                        centerY
                                        +
                                        Math.sin(
                                            particle.angle
                                        )
                                        *
                                        particle.radiusY;

                                    particle.alpha +=
                                        particle.alphaSpeed;

                                    if (
                                        particle.alpha
                                        > 0.95
                                        ||
                                        particle.alpha
                                        < 0.18
                                    ) {

                                        particle
                                            .alphaSpeed
                                            *= -1;
                                    }
                                }

                                drawDustParticle(
                                    particle,
                                    x,
                                    y
                                );

                                return true;
                            }
                        );
                }

                requestAnimationFrame(
                    animateDust
                );
            }

            input.addEventListener(
                "focus",
                () => {

                    active = true;

                    startDust();
                }
            );

            input.addEventListener(
                "blur",
                () => {

                    active = false;
                }
            );

            resizeDustCanvas();
            animateDust();

            window.addEventListener(
                "resize",
                resizeDustCanvas
            );
        }
    );

    /* ============================================
       비밀번호 보기
    ============================================ */

    const passwordInput =
        document.getElementById(
            "password"
        );

    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );

    passwordToggle.addEventListener(
        "click",
        () => {

            const hidden =
                passwordInput.type
                ===
                "password";

            passwordInput.type =
                hidden
                ? "text"
                : "password";

            passwordInput.focus();
        }
    );

    /* ============================================
       로그인
    ============================================ */

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const loginContainer =
        document.querySelector(
            ".login-container"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const loginError =
        document.getElementById(
            "loginError"
        );

    const successFlash =
        document.getElementById(
            "successFlash"
        );

    /* ============================================
       로그인 성공 애니메이션
    ============================================ */

    function playLoginSuccess(
        redirectUrl
    ) {

        console.log(
            "로그인 성공 애니메이션 시작"
        );

        loginForm
            .querySelectorAll(
                "input, button"
            )
            .forEach(
                element => {

                    element.disabled =
                        true;
                }
            );

        loginButton
            .classList
            .remove(
                "loading"
            );

        loginError
            .classList
            .remove(
                "show"
            );

        successAnimation =
            true;

        successProgress =
            0;

        document.body
            .classList
            .add(
                "login-complete"
            );

        successFlash
            .classList
            .add(
                "active"
            );

        loginContainer
            .classList
            .add(
                "login-success"
            );

        function handleAnimationEnd(
            event
        ) {

            if (
                event.target
                !==
                loginContainer
            ) {

                return;
            }

            if (
                event.animationName
                !==
                "gatherAndFade"
            ) {

                return;
            }

            loginContainer
                .removeEventListener(
                    "animationend",
                    handleAnimationEnd
                );

            console.log(
                "로그인 애니메이션 종료"
            );

            window.location.href =
                redirectUrl;
        }

        loginContainer
            .addEventListener(
                "animationend",
                handleAnimationEnd
            );
    }

    /* ============================================
       로그인 실패
    ============================================ */

    function playLoginFailure() {

        loginButton
            .classList
            .remove(
                "loading"
            );

        loginButton.disabled =
            false;

        loginError
            .classList
            .add(
                "show"
            );

        loginContainer
            .classList
            .remove(
                "login-failed"
            );

        void loginContainer.offsetWidth;

        loginContainer
            .classList
            .add(
                "login-failed"
            );
    }

    /* ============================================
       실제 로그인 요청
    ============================================ */

    loginForm.addEventListener(
        "submit",

        async event => {

            event.preventDefault();


            loginError
                .classList
                .remove("show");


            loginButton
                .classList
                .add("loading");


            loginButton.disabled =
                true;


            const formData =
                new FormData(
                    loginForm
                );


            const csrfToken =
                document
                    .querySelector(
                        'meta[name="_csrf"]'
                    )
                    .getAttribute(
                        "content"
                    );


            const csrfHeader =
                document
                    .querySelector(
                        'meta[name="_csrf_header"]'
                    )
                    .getAttribute(
                        "content"
                    );


            try {

                const response =
                    await fetch(
                        "/login",
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/x-www-form-urlencoded",

                                [csrfHeader]:
                                    csrfToken

                            },

                            body:
                                new URLSearchParams(
                                    formData
                                )
                        }
                    );


                console.log(
                    "로그인 응답:",
                    response.status
                );


                if (
                    response.ok
                ) {

                    const data =
                        await response.json();


                    playLoginSuccess(
                        data.redirect
                    );

                } else {

                    playLoginFailure();

                }

            } catch (
                error
            ) {

                console.error(
                    error
                );


                playLoginFailure();

            }

        }
    );

</script>
